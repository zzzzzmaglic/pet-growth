<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>爪迹 · 养宠成长记录与社区</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      color: #253c35;
      background: #f4f7f2;
    }
    main {
      width: 100%;
      max-width: 680px;
      padding: 48px 28px;
      border-radius: 28px;
      background: white;
      box-shadow: 0 16px 60px #253c3510;
    }
    h1 { font-size: 36px; }
    p { line-height: 1.8; color: #62736c; }
    button {
      margin-top: 20px;
      padding: 14px 24px;
      border: 0;
      border-radius: 12px;
      background: #26735b;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #status { min-height: 28px; }
  </style>
</head>
<body>
  <main>
    <div>🐾 PET GROWTH</div>
    <h1>爪迹 · 记录每一步成长</h1>
    <p>宠物健康档案、成长时间线、同城宠友与日常分享。</p>
    <p>产品正在建设中，欢迎来看看。</p>
    <button onclick="document.getElementById('status').textContent =
      '交互测试成功，欢迎来到爪迹！'">
      开始探索
    </button>
    <p id="status" aria-live="polite"></p>
  </main>
</body>
</html>
